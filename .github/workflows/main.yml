name: Build AS BOROK Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android settings.gradle not found."
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Change only app name and verify icon
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found."
            exit 1
          fi

          # ONLY change the app name.
          # Do NOT replace MainActivity, theme, layout or other project code.
          if grep -q 'android:label=' "$MANIFEST"; then
            sed -i 's/android:label="[^"]*"/android:label="BOROK"/' "$MANIFEST"
          else
            sed -i 's/<application /<application android:label="BOROK" /' "$MANIFEST"
          fi

          # Keep the existing BOROK icon from the project.
          if ! grep -q 'android:icon="@drawable/as_borok_icon"' "$MANIFEST"; then
            echo "WARNING: BOROK icon reference was not found."
            echo "Existing project icon will not be changed."
          fi

          echo "Only app name changed."
          echo "Original Activity, theme, layout and project code remain untouched."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e
          gradle --stop || true
          gradle clean
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Check generated APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/BOROK-APP-ONE-FINAL.apk"
          ls -lh "$GITHUB_WORKSPACE/BOROK-APP-ONE-FINAL.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOROK-APP-ONE-FINAL
          path: BOROK-APP-ONE-FINAL.apk
          if-no-files-found: error
