name: Build BOROK APP ONE

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            ! -path "./project/*" \
            -printf "%T@ %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using project ZIP:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching for Gradle files..."
            find project -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) | head -100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Clean old build
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build BOROK Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=$(find "${ANDROID_DIR}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."
            find "${ANDROID_DIR}" -type f -name "*.apk"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p output

          cp "$APK_FILE" \
            "output/BOROK-APP-ONE-FINAL.apk"

      - name: Show APK information
        shell: bash
        run: |
          echo "Final APK:"
          ls -lh output/BOROK-APP-ONE-FINAL.apk

      - name: Upload BOROK APP ONE
        uses: actions/upload-artifact@v4
        with:
          name: BOROK-APP-ONE-FINAL
          path: output/BOROK-APP-ONE-FINAL.apk
          if-no-files-found: error
